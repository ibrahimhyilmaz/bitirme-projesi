    <script>
      (function() {
        // Defensive patch for browser extensions that overwrite window.fetch
        // Resolves: "TypeError: Cannot set property fetch of #<Window> which has only a getter"
        try {
          var originalFetch = window.fetch;
          var fetchHandler = originalFetch ? function() {
            return originalFetch.apply(window, arguments);
          } : undefined;

          // Define getter and setter on window so `window.fetch = ...` succeeds smoothly
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return fetchHandler;
              },
              set: function(fn) {
                fetchHandler = fn;
              }
            });
          } catch (e1) {
            try {
              if (typeof Window !== 'undefined' && Window.prototype) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() {
                    return fetchHandler;
                  },
                  set: function(fn) {
                    fetchHandler = fn;
                  }
                });
              }
            } catch (e2) {}
          }
        } catch (_) {}

        // Suppress unhandled extension errors from polluting or breaking the app
        window.addEventListener('error', function(event) {
          if (!event) return;
          var fn = event.filename || '';
          var msg = event.message || '';
          var stack = (event.error && event.error.stack) ? event.error.stack : '';
          if (
            fn.indexOf('chrome-extension://') !== -1 ||
            stack.indexOf('chrome-extension://') !== -1 ||
            msg.indexOf('Cannot set property fetch') !== -1 ||
            msg.indexOf('requests.js') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (!event) return;
          var reason = event.reason;
          var reasonMsg = String(reason && (reason.message || reason) || '');
          var stack = String(reason && reason.stack || '');
          if (
            reasonMsg.indexOf('chrome-extension://') !== -1 ||
            stack.indexOf('chrome-extension://') !== -1 ||
            reasonMsg.indexOf('Cannot set property fetch') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
